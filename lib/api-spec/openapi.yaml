openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gemini
    description: AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gemini/chat:
    post:
      operationId: sendGeminiChat
      tags: [gemini]
      summary: Stream an AI chat response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiChatInput"
      responses:
        "200":
          description: Server-sent stream of assistant response chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid chat request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
        "503":
          description: AI or chat-history storage is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
  /chat/history:
    get:
      operationId: getChatHistory
      tags: [gemini]
      summary: Load saved chat history
      responses:
        "200":
          description: Saved messages for this browser session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistory"
        "503":
          description: Chat history storage is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
    delete:
      operationId: clearChatHistory
      tags: [gemini]
      summary: Clear saved chat history
      responses:
        "204":
          description: Saved chat history cleared
        "503":
          description: Chat history storage is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GeminiChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 12000
      required: [role, content]
    GeminiChatInput:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/GeminiChatMessage"
      required: [messages]
    ChatHistory:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/GeminiChatMessage"
      required: [messages]
    GeminiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

